<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Una página web sencilla hecha con HTML, CSS y JavaScript.">
  <title>Mi página web</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <span class="site-name">MI PRIMER SITIO WEB</span>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
        Modo oscuro
      </button>
    </div>
  </header>
  <main class="card">
    <h1>¡Hola, mundo!</h1>
    <p id="message">Una página sencilla, hecha con HTML, CSS y JavaScript.</p>
    <button id="welcome-button" type="button">Haz clic aquí</button>
  </main>
  <div class="clock" role="img" aria-label="Reloj analógico con la hora local">
    <span class="clock-number clock-number-12">12</span>
    <span class="clock-number clock-number-3">3</span>
    <span class="clock-number clock-number-6">6</span>
    <span class="clock-number clock-number-9">9</span>
    <span class="clock-hand clock-hand-hour"></span>
    <span class="clock-hand clock-hand-minute"></span>
    <span class="clock-hand clock-hand-second"></span>
    <span class="clock-center"></span>
  </div>
</body>
</html>
